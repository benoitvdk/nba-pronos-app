name: NBA ingestion (results + odds)

on:
  schedule:
    # Hourly: game results only (balldontlie, free tier 5 req/min).
    - cron: "5 * * * *"
    # Daily at 08:00 UTC: results + odds (the-odds-api.com free tier is
    # 500 credits/month, so odds are fetched once a day to stay under quota).
    - cron: "0 8 * * *"
  # Manual runs always fetch odds too.
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Skip odds on the hourly schedule; fetch them on the daily one
          # and on manual runs.
          SKIP_ODDS: ${{ github.event.schedule == '5 * * * *' && '--skip-odds' || '' }}
        run: python -m scripts.ingest --season 2026 $SKIP_ODDS

      - name: Run scoring
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.run_scoring --engine classic